# Builds the site on every push and pull request, so a broken build never reaches main.
name: CI

on:
  push:
    branches: [main]
    paths: ["web/**", "src/**", "tests/**", ".github/workflows/ci.yml"]
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: web
