# Pulls the latest FPL data, re-runs the live part of the pipeline and publishes the site.
# Runs four times a day so injury news and the prediction ledger stay current up to the
# deadline; commits only when something besides the timestamp changed.
name: Refresh data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # finished seasons never change, so keep their downloads between runs
      - uses: actions/cache@v4
        with:
          path: |
            data/raw/2022-23
            data/raw/2023-24
            data/raw/2024-25
            data/raw/2025-26
          key: raw-finished-seasons-v1

      - name: Run the weekly pipeline
        run: python run_pipeline.py --refresh

      - name: Tests
        run: PYTHONPATH=src python -m pytest -q

      - name: Commit if anything changed
        id: commit
        run: |
          if python scripts/only_timestamps_changed.py; then
            echo "Only timestamps changed; nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "fpl-points-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs reports tableau
          MSG=$(python -c "import json; m = json.load(open('reports/live/meta.json')); print('Data refresh: GW%s played, GW%s picks' % (m['last_played_gw'], m['next_gw']))")
          git commit -m "$MSG"
          # someone may have pushed while this ran; keep their code and this run's data
          git pull --rebase -X theirs origin main
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # pushes made with the workflow token don't always start a Pages build on their own
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
